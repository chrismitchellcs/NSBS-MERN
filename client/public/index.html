<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />

    <!-- Defaults (home page). data-rh lets react-helmet replace them per page instead of duplicating;
         api/seo-page.mjs swaps them server-side for crawlers. Keep in sync with src/seo/seoData.mjs. -->
    <title>North Shore Bike Shop | Transition Canada | Mountain Bikes & Service</title>
    <meta
      name="description"
      content="One of the largest Transition dealers in Canada. Transition, Norco and Ibis mountain bikes, plus expert service and repairs on Lonsdale in North Vancouver, BC."
      data-rh="true"
    />
    <meta name="author" content="North Shore Bike Shop" />
    <meta name="geo.region" content="CA-BC" />
    <meta name="geo.placename" content="North Vancouver" />

    <!-- Viewport & Mobile Optimization -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#243d33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Favicon & Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logosquare.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" crossorigin="use-credentials" />

    <!-- Performance Optimization - Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.northshorebikeshop.net" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="North Shore Bike Shop" data-rh="true" />
    <meta property="og:url" content="https://www.northshorebikeshop.net" data-rh="true" />
    <meta property="og:locale" content="en_CA" data-rh="true" />
    <meta
      property="og:title"
      content="North Shore Bike Shop | Transition Canada | Mountain Bikes & Service"
      data-rh="true"
    />
    <meta
      property="og:description"
      content="One of the largest Transition dealers in Canada. Transition, Norco and Ibis mountain bikes, plus expert service and repairs on Lonsdale in North Vancouver, BC."
      data-rh="true"
    />
    <meta
      property="og:image"
      content="https://www.northshorebikeshop.net/bikes-min.jpg"
      data-rh="true"
    />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta
      name="twitter:title"
      content="North Shore Bike Shop | Transition Canada | Mountain Bikes & Service"
      data-rh="true"
    />
    <meta
      name="twitter:description"
      content="One of the largest Transition dealers in Canada. Transition, Norco and Ibis mountain bikes, plus expert service and repairs on Lonsdale in North Vancouver, BC."
      data-rh="true"
    />
    <meta
      name="twitter:image"
      content="https://www.northshorebikeshop.net/bikes-min.jpg"
      data-rh="true"
    />
    <link rel="canonical" href="https://www.northshorebikeshop.net" data-rh="true" />

    <!-- Fonts -->
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    /> -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    />

    <style>
      * {
        font-family: "Inter", sans-serif;
        font-optical-sizing: auto;
        margin: 0;
        box-sizing: border-box;
      }
    </style>
    <!-- Address, phone, and hours must match src/utils/shopHours.js -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BicycleStore",
        "@id": "https://www.northshorebikeshop.net/#organization",
        "name": "North Shore Bike Shop",
        "description": "One of the largest Transition dealers in Canada. Transition, Norco and Ibis mountain bikes, plus expert bike service and repairs in North Vancouver, BC.",
        "url": "https://www.northshorebikeshop.net",
        "logo": "https://www.northshorebikeshop.net/logosquare.png",
        "image": [
          "https://www.northshorebikeshop.net/bikes-min.jpg",
          "https://www.northshorebikeshop.net/IMG_1090-min.jpg"
        ],
        "telephone": "+1-604-929-6727",
        "email": "northshorebikeshop@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1831 Lonsdale Avenue",
          "addressLocality": "North Vancouver",
          "addressRegion": "BC",
          "postalCode": "V7M 2J8",
          "addressCountry": "CA"
        },
        "hasMap": "https://www.google.com/maps/search/?api=1&query=North+Shore+Bike+Shop+1831+Lonsdale+Avenue+North+Vancouver",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "11:00",
            "closes": "19:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "10:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "11:00",
            "closes": "16:00"
          }
        ],
        "sameAs": [
          "https://www.instagram.com/north_shore_bike_shop/",
          "https://www.pinkbike.com/u/north-shore-bike-shop/"
        ],
        "areaServed": [
          { "@type": "City", "name": "North Vancouver" },
          { "@type": "Country", "name": "Canada" }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
